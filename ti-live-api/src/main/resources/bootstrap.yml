spring:
  application:
    name: ti-live-api
  cloud:
    nacos:
      # 配置中心配置（必须在 bootstrap 中配置才能加载远程配置）
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
        enabled: true
        # 共享配置
        shared-configs:
          - data-id: common.yaml
            group: DEFAULT_GROUP
            refresh: true
        # 扩展配置
        extension-configs:
          - data-id: ti-live-api-ext.yaml
            group: DEFAULT_GROUP
            refresh: true
      # 注册中心配置
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: dev
        group: DEFAULT_GROUP
        enabled: true
